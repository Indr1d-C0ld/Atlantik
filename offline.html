<!doctype html>
<meta charset="utf-8">
<title>Atlantik — senza collegamento</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* La carta resta dietro anche qui: e' l'unica pagina che si vede quando non
     c'e' rete, e l'immagine e' gia' nella cache del guscio. */
  body{font:16px/1.6 "Roboto Condensed",system-ui,sans-serif;color:#ccd4d7;
       margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:1.5rem;
       background:
         radial-gradient(ellipse 120% 90% at 50% 40%, rgba(14,17,19,.94), rgba(14,17,19,.84) 78%),
         repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 4px),
         url("assets/img/carta-atlantico-piccola.webp") center center / cover no-repeat,
         #151a1d}
  main{max-width:34rem;background:rgba(21,26,29,.82);border:1px solid #0a0d0e;
       border-radius:3px;padding:1.6rem 1.8rem;box-shadow:0 2px 14px rgba(0,0,0,.55)}
  h1{letter-spacing:.2em;text-transform:uppercase;font-size:1.3rem;color:#c39a52;margin:0 0 1rem}
  p{color:#8c989d}
  p:last-child{margin-bottom:0}
</style>
<main>
<h1>Nessun collegamento</h1>
<p>Atlantik richiede la rete: il mondo — convogli, meteo, orologio di crociera — gira sul server e
continua a girare anche adesso.</p>
<p>Il battello non si ferma perché il telefono ha perso il segnale: quando il collegamento torna,
troverai la situazione avanzata.</p>
</main>
