# Atlantik — configurazione Apache (hardening + URL puliti).
#
# Installata da deploy/00-bootstrap.sh in /etc/apache2/conf-available/atlantik.conf
# e abilitata con a2enconf. Non tocca i vhost esistenti.
#
# NB: DocumentRoot e' /var/www/html (symlink a /data/html). Apache usa il
# percorso col symlink NON risolto per <Directory>.

<Directory /var/www/html/atlantik>
    AllowOverride None
    Options -Indexes +FollowSymLinks
    Require all granted

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /atlantik/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </IfModule>
</Directory>

# Nega l'accesso web alle directory non pubbliche (qualsiasi prefisso di percorso).
<DirectoryMatch "/atlantik/(src|db|bin|config|deploy|storage|views|tests|docs)(/|$)">
    Require all denied
</DirectoryMatch>

# I caricamenti dei giocatori: sono immagini, e devono restare immagini.
#
# Questa regola sta QUI, nella configurazione del server, e non in un .htaccess
# dentro la cartella: sopra c'e' AllowOverride None, quindi gli .htaccess non
# vengono letti nemmeno. Il progetto ne spediva due, con dentro scritto che
# negavano l'esecuzione, e non negavano niente — misurato il 19/09/2026: un
# file .php messo a mano nella cartella dei ritratti veniva ESEGUITO e
# rispondeva 200. Restano dove sono, perche' su un'installazione che legge gli
# .htaccess (un hosting condiviso, per dire) fanno il loro mestiere; ma la
# regola che vale su questa macchina e' questa.
#
# Oggi nessun .php puo' finirci: quello che si carica viene riaperto da GD e
# riscritto in WebP, col nome che e' l'impronta del contenuto. Questa e' la
# rete sotto, per il giorno in cui quella strada cambiasse.
<DirectoryMatch "/atlantik/assets/img/(ritratti|emblemi)/caricati(/|$)">
    Options -Indexes -ExecCGI
    <FilesMatch "\.(php|phtml|php[0-9]|phps|phar|cgi|pl|py|sh|htaccess)$">
        Require all denied
    </FilesMatch>
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
</DirectoryMatch>

# Nega file sensibili sparsi.
<FilesMatch "(^\.|\.(md|sql|lock|log|dist|example|ini)$|composer\.(json|lock))">
    Require all denied
</FilesMatch>
